<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новина | KK "Витоша"</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />
    <script src="https://code.jquery.com/jquery-1.10.2.js"></script>
    <link rel="stylesheet" href="./css_page.css" />
    <link rel="stylesheet" href="./blog.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="overlay" id="overlay"></div>

    <header id="header" data-nosnippet></header>

    <main>
        <section class="content-section single-column">
            <div class="blog-post" id="blog-post">
                <p class="blog-loading">Зареждане…</p>
            </div>
        </section>
    </main>

    <footer id="footer" data-nosnippet></footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="./static/common.js"></script>
    <script src="./static/blog.js"></script>
    <script>
        $(function () {
            $("#header").load("./common_elems/navbar.html", function () {
                runNavLogic();
                initMobileMenu();
            });
            $("#footer").load("./common_elems/footer.html");
            renderBlogPost("blog-post");
        });
        AOS.init({
            offset: 120,
            delay: 100,
            duration: 800,
            easing: 'ease',
            once: false,
            mirror: false,
            anchorPlacement: 'top-bottom'
        });
    </script>
</body>

</html>
